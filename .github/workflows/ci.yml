name: CI

# Minimal Phase 2 gate, per Phase 2 Definition of Done (item 6): typecheck,
# lint, build, and the RLS isolation suite must all pass before any merge.
# Full CI/CD (staging auto-deploy, production manual-approval gate,
# Dependabot, load testing) is a Phase 13 task — this is deliberately just
# the safety net Phase 2 needs to exist now.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace=apps/web
      - name: Lint
        run: npm run lint --workspace=apps/web
      - name: Build
        run: npm run build --workspace=apps/web

  rls-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run RLS isolation suite
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash apps/web/tests/rls/run_rls_tests.sh

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test --workspace=apps/web
